[project]
name = "alignment-estimation-benchmark"
version = "0.1.0"
description = "アライメント計測値の面内推定：説明変数と手法の比較（模擬データ）"
requires-python = ">=3.14.5"
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "pandas==3.0.6",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
